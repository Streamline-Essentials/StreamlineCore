apply from: "$rootDir/modules/module.gradle"

ext {
    jdaVersion = "5.0.0-beta.21"
}

repositories {
    maven { url = "https://repo.kryptonmc.org/releases" }
}

dependencies {
    // StreamlineMessaging is a sibling module, so it resolves from this build rather
    // than from a published snapshot.
    compileOnly project(":modules:StreamlineMessaging")

    shadow(implementation("net.dv8tion:JDA:$jdaVersion").exclude(group: "org.slf4j"))
    shadow(implementation("club.minnced:discord-webhooks:0.8.4").exclude(group: "org.slf4j"))
}
