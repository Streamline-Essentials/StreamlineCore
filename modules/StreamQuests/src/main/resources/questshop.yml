# StreamQuests quest shop: /questshop (alias /qshop).
# Players spend the points they earn from quests (see quests.yml) on the items below.
#
# Each item:
#   category:     a key under "categories".
#   name:         the item's display name (& and hex colors).
#   icon:         the menu icon's item id; modded ids work (e.g. "create:wrench").
#   icon-amount:  (optional) the icon's stack size.
#   glowing:      (optional) gives the icon an enchanted glint.
#   description:  (optional) lore lines above the rewards.
#   price:        the cost in quest points.
#   permission:   (optional) needed to see and buy it.
#   order:        (optional) sort order in its category; ties sort by price.
#   rewards:      a list, given top to bottom. Every item can have several.
#
# Reward types:
#   ITEM       item: <namespaced id>   amount: <count>   data: (optional) components or NBT,
#              written right after the id, e.g. '[minecraft:custom_name="Lucky"]' (1.20.5+)
#              or '{display:{Name:"..."}}' (1.20.4 and older).
#   EXP        amount: <number>   levels: true (levels) / false (experience points).
#   POTION     effect: <namespaced id>   duration: <seconds, 0 = infinite>   level: <1 = I>
#              hide-particles: true/false.
#   MESSAGE    message: <text or list>, sent to the buyer.
#   BROADCAST  message: <text or list>, sent to everyone online.
#   COMMAND    commands: <list>, prefixed like quest rewards: "@c" console, "@s" the buyer,
#              '@u:"<uuid>"' / '@n:"<name>"' someone else. Unprefixed commands run as the console.
#   Any reward can set display: "<lore line>" (or "" to hide it from the menu).
#
# Text and commands accept placeholders, plus %player% (the buyer's name) and %uuid%.
# Items, experience and effects are given with the server's own give / experience / effect
# commands, so anything registered on the server works, including modded items and effects.
# An item or effect the server does not have is never charged for: with hide-unavailable on,
# its shop item is hidden (this is how the "New Additions" below only show on versions that
# have them).

settings:
  title: "&6&lQuest Shop"
  # Open a confirmation screen before spending points.
  confirm-purchases: true
  # Hide shop items whose item or effect this server does not have.
  hide-unavailable: true

# %item% the shop item's name, %price% its price, %points% the buyer's points after the
# purchase, %missing% how many more points the buyer needs.
messages:
  purchased: "&aYou bought &f%item% &afor &e%price% &apoints&8. &7(&e%points% &7left)"
  not-enough-points: "&cYou need &e%missing% &cmore points for &f%item%&c."
  no-permission: "&cYou cannot buy &f%item%&c."
  unavailable: "&f%item% &cis not available on this server."
  not-loaded: "&cYour quest points are still loading. Try again in a moment."

