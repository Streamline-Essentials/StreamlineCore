# StreamlineCollections catalog.
#
# Every id here (icons and sources) is a Minecraft item or block id. "wheat" means
# "minecraft:wheat"; modded content uses its full id, such as "create:zinc_ore".
#
# Sources:
#   blocks:  blocks a player breaks (one per block, whatever it drops)
#   drops:   items dropped by mobs a player kills (each item counts its amount)
#   fish:    items a player reels in with a fishing rod
#   buckets: buckets a player fills (one per fill)
#
# Not every platform reports every source; see the module README.

# Amounts needed for each level, unless a collection sets its own `tiers`.
default-tiers:
  - 50
  - 100
  - 250
  - 500
  - 1000
  - 2500
  - 5000
  - 10000
  - 25000
  - 50000

# Blocks that only count once fully grown.
mature-only:
  - wheat
  - carrots
  - potatoes
  - beetroots
  - nether_wart
  - cocoa

# Menu order follows this list. `color` tints the category's menus.
categories:
  farming:
    name: "Farming"
    icon: wheat
    color: "#FFCC00"
  mining:
    name: "Mining"
    icon: cobblestone
    color: "#C0C0C0"
  combat:
    name: "Combat"
    icon: bone
    color: "#FF5555"
  foraging:
    name: "Foraging"
    icon: oak_log
    color: "#55FF55"
  fishing:
    name: "Fishing"
    icon: cod
    color: "#55FFFF"

