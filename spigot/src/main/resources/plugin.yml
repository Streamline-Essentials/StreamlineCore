name: '${name}'
version: '${version}'
main: 'net.streamline.base.StreamlineSpigot'
# Without an api-version Bukkit loads the plugin as legacy (pre-1.13) and remaps every
# Material it touches to legacy ids, which newer servers no longer resolve.
api-version: '1.13'

authors: [ Drak ]
website: https://github.com/Streamline-Essentials
description: True potential is here. A Proxy and Spigot plugin that opens up endless cross-platform possibilities.

depend:
  - BukkitOfUtils
# Maven Central libs — downloaded by Spigot/Paper (not shaded into this jar).
libraries:
${librariesBlock}
softdepend:
  - LuckPerms
  - Geyser-Spigot
  - Geyser-Folia
  - PlaceholderAPI
  - floodgate
  - CMI
  - EssentialsX
  - Essentials

folia-supported: true

commands:
  streamlinespigot:
    description: Main command for Streamline
    permission: streamline.command.base.default
    aliases:
      - sls
      - streamline
      - sl
