// Conventions shared by every Fabric, Forge and NeoForge subproject.
//
// A version project's build.gradle sets its versions in `ext` and applies its loader's
// script (fabric/fabric.gradle, forge/forge.gradle, neoforge/neoforge.gradle). The loader
// script applies the loader's Gradle plugin, then this file, and finally names the task
// whose jar is the shippable mod in `ext.modJarTask`, which deploy copies.
//
// Every version project expects in `ext`:
//   mcVersion       Minecraft version compiled against
//   javaVersion     Java release the Minecraft version runs on
//   minecraftRange  Minecraft versions the mod metadata accepts, in the loader's syntax
//   modSourceDirs   source roots, relative to the repository root, that the loader adds
//                   on top of mod-common (each holding src/main/java and/or resources)
// and optionally:
//   modResourceDirs roots whose src/main/resources alone are added
//   metadataExtras  further values expanded into the mod metadata files

apply from: "$rootDir/dependencies.gradle"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.javaVersion as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        (['mod-common'] + project.modSourceDirs).each { dir ->
            java.srcDir rootProject.file("${dir}/src/main/java")
            resources.srcDir rootProject.file("${dir}/src/main/resources")
        }
        (project.ext.has('modResourceDirs') ? project.modResourceDirs : []).each { dir ->
            resources.srcDir rootProject.file("${dir}/src/main/resources")
        }

        // Minecraft calls that changed shape between versions, one implementation per era,
        // plus the pack.mcmeta that 1.20.1's Forge-family loaders expect in every mod jar.
        def mc = project.mcVersion.toString()
        def compat = mc.startsWith('1.20.') ? 'mc1201' : (mc == '1.21.1' ? 'mc1211' : 'current')
        java.srcDir rootProject.file("mod-common/compat/${compat}/src/main/java")
        resources.srcDir rootProject.file("mod-common/compat/${compat}/src/main/resources")

        // Menu clicks arrive as a ClickType up to 1.21.11 and as a ContainerInput from 26.1.
        def menu = mc.startsWith('1.') ? 'menu-clicktype' : 'menu-containerinput'
        java.srcDir rootProject.file("mod-common/compat/${menu}/src/main/java")

        // The game client's screens and HUD, plus the era that matches this version's GUI API:
        // 1.20.x, 1.21.1, 1.21.11 (JOML matrices, input events) and 26.x (GuiGraphicsExtractor).
        // Only client-only classes reach into them, so a dedicated server never loads them.
        java.srcDir rootProject.file('client-common/src/main/java')
        java.srcDir rootProject.file('client-common/modern/src/main/java')
        def gfx = mc.startsWith('1.20.') ? 'gfx1201' : (mc == '1.21.1' ? 'gfx1211' : (mc.startsWith('1.') ? 'gfx12111' : 'gfx26'))
        java.srcDir rootProject.file("client-common/compat/${gfx}/src/main/java")

        // Mojang renamed EnderMan to Enderman in 26.3.
        def enderman = (mc.startsWith('1.') || mc.startsWith('26.1') || mc.startsWith('26.2')) ? 'enderman-upto262' : 'enderman-263'
        java.srcDir rootProject.file("mod-common/compat/${enderman}/src/main/java")
    }
}

configurations {
    // Everything bundled into the mod jar: mod loaders have no library downloader.
    // Each dependency is non-transitive, so exactly what is listed ships and nothing the
    // game already has.
    modShade {
        canBeConsumed = false
    }

    // The mod compiles against exactly what it ships. Pulling the full PLATFORM_LIBRARIES
    // (or anything transitive) onto the compile classpath would request Netty/SLF4J/Gson
    // versions that clash with the strict ones the loaders pin for the game.
    compileOnly.extendsFrom modShade
}

dependencies {
    compileOnly "net.luckperms:api:${rootProject.properties['lp_version']}"
    compileOnly 'org.jetbrains:annotations:24.0.1'

    // The shaded libraries come before TheBase so their copies win over the stale ones
    // bundled inside TheBase's fat jar.
    (MOD_SHADED_LIBRARIES + THE_BASE).each { modShade(it) { transitive = false } }
    modShade(project(path: ':StreamlineCore-API', configuration: 'shadow')) { transitive = false }
}

tasks.named('compileJava') { dependsOn(':StreamlineCore-API:shadowJar') }
tasks.matching { it.name == 'delombok' }.configureEach { dependsOn(':StreamlineCore-API:shadowJar') }

def metadataProperties = [
        name          : rootProject.name.toString(),
        version       : rootProject.version.toString(),
        mcVersion     : project.mcVersion.toString(),
        javaVersion   : project.javaVersion.toString(),
        minecraftRange: project.minecraftRange.toString(),
] + (project.ext.has('metadataExtras') ? project.metadataExtras : [:])

tasks.named('processResources', ProcessResources) {
    inputs.properties(metadataProperties)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'streamline.properties']) {
        expand(metadataProperties)
    }
}

// Shaded libraries move under net.streamline.libs so they cannot collide with other mods'
// copies: a package shipped by two mods either stops Forge/NeoForge from starting or, as with
// C2ME's Reactive Streams, links one mod's classes against the other's and fails with a
// loader constraint violation. RelocatingModuleTransformer applies the same table to modules
// at load time, since they are compiled against the original packages; the table reaches it
// through a generated resource.
//
// Left in place: org.sqlite, whose native library binds JNI functions to the original class
// names; org.pf4j, the module contract; and TheBase, singularity and net.streamline, which
// are Streamline's own.
def modRelocations = [
        'org.reactivestreams'            : 'net.streamline.libs.reactivestreams',
        'reactor'                        : 'net.streamline.libs.reactor',
        'io.lettuce'                     : 'net.streamline.libs.lettuce',
        'redis.clients.authentication'   : 'net.streamline.libs.redis.authentication',
        'com.github.benmanes.caffeine'   : 'net.streamline.libs.caffeine',
        'com.github.zafarkhaja.semver'   : 'net.streamline.libs.semver',
        'com.zaxxer.hikari'              : 'net.streamline.libs.hikari',
        'com.mysql'                      : 'net.streamline.libs.mysql',
        'com.google.protobuf'            : 'net.streamline.libs.protobuf',
        'org.json'                       : 'net.streamline.libs.json',
        'com.esotericsoftware.yamlbeans' : 'net.streamline.libs.yamlbeans',
]

def relocationsDir = layout.buildDirectory.dir('generated/relocations')
def writeRelocations = tasks.register('writeModuleRelocations') {
    def relocations = modRelocations.collect { from, to -> "${from}=${to}" }.join('\n') + '\n'
    def outFile = relocationsDir.map { it.file('streamline-relocations.properties') }
    inputs.property('relocations', relocations)
    outputs.file(outFile)
    doLast {
        outFile.get().asFile.text = relocations
    }
}
sourceSets.main.resources.srcDir(files(relocationsDir).builtBy(writeRelocations))

// The plain jar holds only this project's classes; the shaded jar is the one that runs.
tasks.named('jar', Jar) {
    archiveClassifier.set('plain')
}

// What the mod bundles from modShade, shared by the shipped jar and the dev runs' library jar.
def bundleLibraries = { task ->
    task.configurations = [project.configurations.modShade]

    // Several shaded jars register services under the same file (JDBC drivers above all).
    // Gradle drops duplicate paths before Shadow's transformers see them, so service files
    // keep every copy for mergeServiceFiles() while all other duplicates keep the first.
    // Kotlin module metadata likewise goes through Shadow's merging transformer.
    task.duplicatesStrategy = DuplicatesStrategy.INCLUDE
    task.filesNotMatching(['META-INF/services/**', 'META-INF/*.kotlin_module']) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    task.mergeServiceFiles()

    // Test-framework leftovers in TheBase's fat jar.
    task.exclude 'org/opentest4j/**'

    // The game or the loader already ships these (Forge/NeoForge refuse a second jar
    // exporting the same package), and Logback must not compete with the game's Log4j for
    // SLF4J. The JetBrains annotations are compile-time only.
    task.exclude 'com/google/gson/**'
    task.exclude 'com/google/common/**'
    task.exclude 'org/slf4j/**'
    task.exclude 'ch/qos/logback/**'
    task.exclude 'org/jetbrains/annotations/**'
    task.exclude 'org/intellij/lang/annotations/**'
    task.exclude 'META-INF/services/org.slf4j.spi.SLF4JServiceProvider'
    task.exclude 'META-INF/services/ch.qos.logback.**'
    task.exclude 'logback*.xml'

    // TheBase's fat jar carries its own relocated database drivers and test classes.
    task.exclude 'org/junit/**'
    task.exclude 'gg/drak/thebase/lib/mysql/**'
    task.exclude 'gg/drak/thebase/lib/hikari/**'
    task.exclude 'gg/drak/thebase/lib/sqlite/**'

    // A module descriptor would turn the jar into an explicit JPMS module on Forge/NeoForge,
    // and leftover signatures would fail verification once the jar is repacked.
    task.exclude 'module-info.class'
    task.exclude 'META-INF/versions/*/module-info.class'
    task.exclude 'META-INF/*.SF'
    task.exclude 'META-INF/*.DSA'
    task.exclude 'META-INF/*.RSA'
    task.exclude 'META-INF/maven/**'
}

tasks.named('shadowJar') {
    bundleLibraries(it)
    archiveBaseName.set(project.name)
    archiveClassifier.set('')
    modRelocations.each { from, to -> relocate(from, to) }
}

// Dev runs load the mod from its compiled classes, which use the libraries' original
// packages, so they get the bundled libraries unrelocated in one jar of their own. The raw
// library jars cannot go on a Forge-family run as they are: TheBase's fat jar exports packages
// another library also exports, and some declare Multi-Release without any versioned entries,
// both of which stop the module system from starting.
// A script plugin cannot name the Shadow plugin's classes directly, so the task type comes
// through the loader that defined shadowJar.
def shadowJarType = Class.forName('com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar', true,
        tasks.named('shadowJar').get().getClass().classLoader)
def devLibrariesJar = tasks.register('devLibrariesJar', shadowJarType) {
    bundleLibraries(it)
    archiveBaseName.set(project.name)
    archiveClassifier.set('dev-libraries')
    destinationDirectory.set(layout.buildDirectory.dir('dev-libraries'))
}
def devLibraries = files(devLibrariesJar.flatMap { it.archiveFile }).builtBy(devLibrariesJar)

// Fabric and ModDevGradle from Minecraft 1.21.9 read the runtime classpath. Up to 1.21.8,
// ModDevGradle's runs ignore non-mod jars there and take them from
// additionalRuntimeClasspath instead, which it rejects outright on later versions.
// ForgeGradle 7 takes them as each run's extra libraries.
dependencies {
    runtimeOnly devLibraries
}
def mcForRuns = project.mcVersion.toString()
if (mcForRuns.startsWith('1.20.') || mcForRuns == '1.21.1') {
    configurations.matching { it.name == 'additionalRuntimeClasspath' }.configureEach { configuration ->
        project.dependencies.add(configuration.name, devLibraries)
    }
}
plugins.withId('net.minecraftforge.gradle') {
    minecraft.runs.configureEach {
        extraLibraries.from(devLibraries)
    }
}

tasks.register('deploy', Copy) {
    def deployDir = file(System.getenv("DEPLOY_DIR") ?: "$rootDir/deploy")
    def modJar = tasks.named(project.modJarTask)

    dependsOn modJar
    from modJar.map { it.outputs.files.filter { it.name.endsWith('.jar') } }
    into deployDir

    doFirst {
        println "Deploying ${project.name} to: $deployDir"
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('deploy')
}
