buildscript {
    repositories {
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev"
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net"
        }
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "NeoForge"
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            name = "NeoForge-snapshots"
            url = "https://maven.neoforged.net/snapshots"
        }
    }

    dependencies {
        classpath("com.gradleup.shadow:shadow-gradle-plugin:8.3.6") // for shadowing
        classpath("io.freefair.gradle:lombok-plugin:8.6")
        classpath("net.fabricmc:fabric-loom:1.13.4")
        classpath("net.minecraftforge.gradle:ForgeGradle:6.0.+") { changing = true }
        classpath("net.neoforged.gradle:userdev:7.1.22")
    }
}

//plugins {
//    id "maven-publish"
//}

allprojects {
    apply plugin: "java"
    apply plugin: "com.gradleup.shadow"
    apply plugin: "io.freefair.lombok"
    apply plugin: "maven-publish"

    version = rootProject.properties["version"]
    group = rootProject.properties["group"]

    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    artifacts {
        archives shadowJar
    }

    repositories {
        // Spigot / Bukkit
        maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
        maven { url "https://oss.sonatype.org/content/repositories/central" }
        // Paper / Velocity
        maven {
            name = 'papermc'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }

        // OpenCollab
        maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
        maven { url 'https://repo.opencollab.dev/maven-releases/'}

        // PlaceholderAPI
        maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi" }

        // CodeMC
        maven { url "https://repo.codemc.io/repository/maven-releases/" }
        maven { url "https://repo.codemc.io/repository/maven-snapshots/" }

        // Streamline Essentials repository
        maven {
            name = "streamline-essentials"
            url = "https://repo.codemc.io/repository/streamline-essentials/"
        }

        // Local libs folder as a flat directory repository
        flatDir {
            dirs "${rootDir}/libs"
        }
    }
}

// Core platform projects only. Modules under modules/ are configured by
// modules/module.gradle instead: they have no plugin.yml to expand, are not published
// to the Streamline Maven repo, and must keep their own version and manifest.
configure(subprojects.findAll { ! it.path.startsWith(':modules') }) {
    apply from: rootDir.toString() + "/dependencies.gradle"

    ext {
        pluginMain = rootProject.properties["plugin.main"] == "default" ?
                project.group.toString() + "." + project.name.toString().toLowerCase() + "." + project.name.toString() :
                properties["plugin.main"]
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    processResources {
        // Debugging: Print values
        doFirst {
            println "Version: " + rootProject.version.toString() + ", Name: " + rootProject.name.toString() + ", Main: " + project.ext.pluginMain.toString()
            if (project.ext.has("PLATFORM_LIBRARIES")) {
                println "Platform libraries (${project.ext.PLATFORM_LIBRARIES.size()}):"
            }
        }

        inputs.property("name", rootProject.name.toString())
        inputs.property("version", rootProject.version.toString())
        inputs.property("main", project.ext.pluginMain.toString())
        inputs.property("libraries", project.ext.PLATFORM_LIBRARIES.join('|'))
        outputs.dir(file("build/generated-src"))

        filesMatching("**/plugin.yml") {
            expand (
                    "name": rootProject.name.toString(),
                    "version": rootProject.version.toString(),
                    "librariesBlock": project.ext.PLATFORM_LIBRARIES.collect { "  - ${it}" }.join('\n'),
            )
        }
        filesMatching("**/velocity-plugin.json") {
            expand (
                    "name": rootProject.name.toString(),
                    "version": rootProject.version.toString(),
            )
        }
        filesMatching("**/streamline.properties") {
            expand (
                    "name": rootProject.name.toString(),
                    "version": rootProject.version.toString(),
            )
        }
        filesMatching("**/singularity.properties") {
            expand (
                    "name": rootProject.name.toString(),
                    "version": rootProject.version.toString(),
            )
        }
        filesMatching("**/fabric.mod.json") {
            expand (
                    "name": rootProject.name.toString(),
                    "version": rootProject.version.toString(),
            )
        }
        filesMatching("**/mods.toml") {
            expand (
                    "name": rootProject.name.toString(),
                    "version": rootProject.version.toString(),
            )
        }
    }

    // Keep the plain jar from overwriting the shadowed main artifact.
    tasks.named('jar', Jar).configure {
        archiveClassifier.set('plain')
    }

    shadowJar {
        manifest {
            attributes(
                    "Implementation-Title": rootProject.name.toString(),
                    "Implementation-Version": rootProject.version.toString()
            )
        }

        // Relocations only apply when those packages are actually shaded (mod loaders).
        relocate("com.github.Anon8281.universalScheduler", "host.plas.bou.libs.universalScheduler")

        archiveClassifier.set('')
        archiveFileName = project.name + "-" + project.version + ".jar"

//        minimize()
    }

    tasks.register('deploy', Copy) {
        // Define the deployment directory
        def deployDir = file(System.getenv("DEPLOY_DIR") ?: "$rootDir/deploy")

        // Ensure the deployment directory exists
        doFirst {
            println "Deploying to: $deployDir"
            deployDir.mkdirs()
            println "Generated JAR file: ${shadowJar.archiveFile}"
        }

        // Copy the shadowJar output
        from shadowJar.archiveFile
        into deployDir
    }

    // Ensure that the deploy task runs after the shadowJar task
    shadowJar.finalizedBy(deploy)

    tasks.named('deploy').configure {
        dependsOn 'shadowJar', 'sourcesJar', 'javadocJar'
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    // Lombok @Getter/@Setter (and default ctors) lack per-method Javadoc after delombok.
    // Keep real doclint issues; drop the missing-comment noise that floods clean builds.
    tasks.withType(Javadoc).configureEach {
        options {
            addBooleanOption('Xdoclint:all,-missing', true)
            encoding = 'UTF-8'
            charSet = 'UTF-8'
        }
        failOnError = false
    }

    publishing {
        publications {
            maven(MavenPublication) {
                groupId project.group
                artifactId "$project.name"
                version project.version

                from components.java
            }
        }

        repositories {
            maven {
                url = "https://repo.codemc.io/repository/streamline-essentials/"

                def mavenUsername = System.getenv("JENKINS_NEXUS_USERNAME")
                def mavenPassword = System.getenv("JENKINS_NEXUS_PASSWORD")

                if (mavenUsername != null && mavenPassword != null) {
                    credentials {
                        username = mavenUsername
                        password = mavenPassword
                    }
                }
            }
        }
    }
}

// Modules build a shadowed PF4J JAR and drop it next to the platform JARs, but are
// not published to the Streamline Maven repo -- they are plugins, not API artifacts.
// ':modules' itself is just a container and produces nothing.
configure(subprojects.findAll { it.path.startsWith(':modules') && it.path != ':modules' }) {
    tasks.register('deploy', Copy) {
        def deployDir = file(System.getenv("DEPLOY_DIR") ?: "$rootDir/deploy")
        def modulesDir = new File(deployDir, "modules")

        doFirst {
            modulesDir.mkdirs()
            println "Deploying module ${project.name} to: $modulesDir"
        }

        from shadowJar.archiveFile
        into modulesDir
    }

    shadowJar.finalizedBy(deploy)
}

// The ':modules' container has no sources; keep it from producing an empty artifact.
project(':modules') {
    tasks.matching { it.name in ['shadowJar', 'jar', 'publish', 'publishToMavenLocal'] }
            .configureEach { it.enabled = false }
}

tasks.register("clearDeploys", Delete) {
    // Define the deployment directory
    def deployDir = file(System.getenv("DEPLOY_DIR") ?: "$rootDir/deploy")

    deployDir.mkdirs()
    File[] files = deployDir.listFiles()
    if (files != null) {
        files.each { file ->
            if (file.isFile()) {
                file.delete()
            }
        }
    }
}

clean.finalizedBy(clearDeploys)
tasks.named('clearDeploys').configure {
    dependsOn 'clean'
}

clearDeploys.finalizedBy(build)
tasks.named("build").configure {
    doFirst {
        tasks.named('clean')
    }
}

build.finalizedBy(publish)
tasks.named("publish").configure {
    doFirst {
        tasks.named('build')
    }
}

wrapper {
    gradleVersion = "8.9"
    distributionType = Wrapper.DistributionType.ALL
}