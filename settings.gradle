rootProject.name = properties['name']

include ':singularity-api'
include ':api'
include ':backend-api'

if (! isCI()) {
    include ':bungee'
    include ':spigot'
    include ':velocity'
}

// Mod-loader subprojects: every loader builds for every supported Minecraft version.
// Each is named <loader>-<version digits> and lives under its loader's folder.
def MOD_LOADERS = ['fabric', 'forge', 'neoforge']
def MOD_VERSIONS = ['1201', '1211', '12111', '262', '263']

// Fabric Loom 1.18 runs only on a Java 25 JVM, so the mod subprojects (and the loader
// plugins in the root buildscript) are included only when Gradle itself runs on Java 25.
// CI builds just the API artifacts and never includes them.
gradle.ext.buildMods = ! isCI() && JavaVersion.current() >= JavaVersion.VERSION_25

if (gradle.ext.buildMods) {
    MOD_LOADERS.each { loader ->
        MOD_VERSIONS.each { mc ->
            def path = ":${loader}-${mc}"
            include path
            project(path).projectDir = file("${loader}/${loader}-${mc}")
        }
    }
} else if (! isCI()) {
    logger.warn("[StreamlineCore] Skipping the Fabric/Forge/NeoForge subprojects: they need Gradle " +
            "to run on Java 25, but it is running on Java ${JavaVersion.current()}. Point JAVA_HOME " +
            "at a Java 25 JDK to build them.")
}

findProject(':backend-api').name = 'bapi'
findProject(':singularity-api').name = 'sapi'

findProject(':sapi').name = rootProject.name + '-Singularity'
findProject(':api').name = rootProject.name + '-API'
findProject(':bapi').name = rootProject.name + '-BAPI'

if (! isCI()) {
    findProject(':bungee').name = rootProject.name + '-Bungee'
    findProject(':spigot').name = rootProject.name + '-Spigot'
    findProject(':velocity').name = rootProject.name + '-Velocity'

    if (gradle.ext.buildMods) {
        def LOADER_NAMES = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge']
        LOADER_NAMES.each { loader, display ->
            MOD_VERSIONS.each { mc ->
                findProject(":${loader}-${mc}").name = rootProject.name + "-${display}-${mc}"
            }
        }
    }
}

// Self-provided modules: any folder under modules/ holding a build.gradle is picked up
// automatically, so adding a module means dropping its sources in -- nothing to register
// here. Included on Jenkins so its build produces the module JARs alongside the platform
// ones; skipped on JitPack, which resolves only the API artifacts.
if (! isJitPack()) {
    def modulesDir = file('modules')
    if (modulesDir.isDirectory()) {
        modulesDir.listFiles()
                .findAll { it.isDirectory() && new File(it, 'build.gradle').isFile() }
                .sort { it.name }
                .each { include ":modules:${it.name}" }
    }
}

// JitPack builds only the API artifacts that downstream plugins depend on.
static def isJitPack() {
    return System.getenv("JITPACK") != null
}

// Jenkins builds everything that ships, modules included.
static def isJenkins() {
    return System.getenv("JENKINS") != null
}

static def isCI() {
    return isJenkins() || isJitPack()
}
