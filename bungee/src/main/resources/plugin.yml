name: '${name}'
version: '${version}'
main: 'net.streamline.base.StreamlineBungee'
authors:
  - Drak
website: https://github.com/Streamline-Essentials
description: True potential is here. A Proxy and Spigot plugin that opens up endless cross-platform possibilities.
depend:
  - LuckPerms
soft-depend:
  - Geyser-Bungee
  - floodgate
# Maven Central libs — downloaded by BungeeCord (not shaded into this jar).
libraries:
${librariesBlock}

commands:
  streamlinespigot:
    description: Main command for Streamline
    permission: streamline.command.base.default
    aliases:
      - sls
      - streamline
      - sl
