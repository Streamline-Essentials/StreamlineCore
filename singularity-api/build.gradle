dependencies {
    // Defaults.
    compileOnly(files(FILES))
    annotationProcessor(ANNO)
    annotationProcessor(THE_BASE)
    compileOnly(COMP_ONLY)

    // Downloadable libs: compile only — Spigot/Bungee/Velocity fetch at runtime.
    compileOnly(PLATFORM_LIBRARIES)

    // PF4J must ship inside this jar so module PluginClassLoaders can see CosmicModule.
    HOST_SHADED_LIBRARIES.each { coord ->
        shadow(implementation(coord))
    }

    // The Base
    compileOnly(THE_BASE)

    // JetBrains annotations (compile-only).
    annotationProcessor(compileOnly('org.jetbrains:annotations:20.1.0'))
}

shadowJar {
    // Project classes + HOST_SHADED_LIBRARIES only (no Hikari/Netty/etc.).
    configurations = [project.configurations.shadow]
}
