configurations {
    theBaseLibraries
}

dependencies {
    // Defaults.
    compileOnly(files(FILES))
    annotationProcessor(ANNO)
    compileOnly(COMP_ONLY)

    // Downloadable libs: compile only — Spigot/Bungee/Velocity fetch at runtime.
    compileOnly(PLATFORM_LIBRARIES)

    // The module core rides inside this jar (and from here inside the API and mod jars), so
    // anything that has Singularity also has the client module API.
    shadow(implementation(project(':StreamlineCore-ModuleCore')))

    // PF4J must ship inside this jar so module PluginClassLoaders can see CosmicModule.
    HOST_SHADED_LIBRARIES.each { coord ->
        shadow(implementation(coord))
    }

    // TheBase's own source lives in this project (gg.drak.thebase). Its libraries are compiled
    // against under their original names and packed in, relocated by shadowJar below. They sit in
    // their own configuration, not 'shadow': other projects consume 'shadow', and would otherwise
    // receive the unrelocated jars beside this one.
    THE_BASE_LIBRARIES.each { coord ->
        compileOnly(coord) { transitive = false }
        theBaseLibraries(coord) { transitive = false }
    }

    // JetBrains annotations (compile-only).
    annotationProcessor(compileOnly('org.jetbrains:annotations:20.1.0'))
}

shadowJar {
    // Project classes + HOST_SHADED_LIBRARIES only (no Hikari/Netty/etc.).
    configurations = [project.configurations.shadow, project.configurations.theBaseLibraries]

    // Modules and other plugins import TheBase's libraries under these names, as the published
    // gg.drak:TheBase jar shipped them, so the targets must not change.
    // SimplixStorage's own libraries keep the names its published jar gave them.
    relocate 'de.leonhard', 'gg.drak.thebase.lib.leonhard'
    relocate 'org.json', 'gg.drak.thebase.lib.leonhard.storage.shaded.json'
    relocate 'com.esotericsoftware', 'gg.drak.thebase.lib.leonhard.storage.shaded.esotericsoftware'
    relocate 'net.objecthunter.exp4j', 'gg.drak.thebase.lib.exp4j'
    relocate 'com.google.re2j', 'gg.drak.thebase.lib.re2j'

    exclude 'META-INF/maven/com.esotericsoftware.yamlbeans/**'
    exclude 'META-INF/maven/org.json/**'
}
