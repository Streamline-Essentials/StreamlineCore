dependencies {
    // Platform
    annotationProcessor(compileOnly('com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'))

    // Defaults.
    compileOnly(files(FILES))
    annotationProcessor(ANNO)
    annotationProcessor(THE_BASE)
    compileOnly(COMP_ONLY)
    compileOnly(PLATFORM_LIBRARIES)

    // Other Plugins
    compileOnly(OTHER_PLUGINS)

    // The Base (not on Maven Central — shade, but strip libs the downloader provides)
    shadow(THE_BASE)

    // Thin Streamline API
    shadow project(path: ':StreamlineCore-API', configuration: 'shadow')
    compileOnly project(path: ':StreamlineCore-Singularity')
}

compileJava {
    dependsOn(":StreamlineCore-API:shadowJar")
}

delombok {
    dependsOn(":StreamlineCore-API:shadowJar")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property('libraries', PLATFORM_LIBRARIES.join('|'))
    filesMatching('**/velocity-libraries.txt') {
        expand('librariesBlock': PLATFORM_LIBRARIES.join('\n'))
    }
}

shadowJar {
    configurations = [project.configurations.shadow]

    THE_BASE_EXCLUDES.each { exclude it }

    // Never shade downloadable libs — VelocityLibraryLoader fetches them.
    exclude 'com/zaxxer/hikari/**'
    exclude 'org/sqlite/**'
    exclude 'com/mysql/**'
    exclude 'com/google/protobuf/**'
    exclude 'com/google/gson/**'
    exclude 'com/github/benmanes/caffeine/**'
    // Keep org.pf4j — required on the host classloader for modules.
    exclude 'ch/qos/logback/**'
    exclude 'org/slf4j/**'
    exclude 'com/google/common/**'
    exclude 'io/lettuce/**'
    exclude 'io/netty/**'
    exclude 'reactor/**'
    exclude 'org/reactivestreams/**'
    exclude 'redis/clients/**'
}
