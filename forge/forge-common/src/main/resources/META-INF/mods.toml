modLoader="javafml"
loaderVersion="[${loaderMajor},)"
license="MIT"

[[mods]]
    modId="streamlinecore"
    version="${version}"
    displayName="${name}"
    description="StreamlineCore for Forge servers and clients."
    # Optional on both ends: clients connect whether or not they or the server have the mod.
    displayTest="IGNORE_ALL_VERSION"

[[dependencies.streamlinecore]]
    modId="forge"
    mandatory=true
    versionRange="[${loaderMajor},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.streamlinecore]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraftRange}"
    ordering="NONE"
    side="BOTH"
